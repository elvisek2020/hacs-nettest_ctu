[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "N",
  "UP",
  "B",
  "C4",
  "SIM",
  "RUF",
  "ASYNC",
  "PL",
  "ANN",
  "D",
]
ignore = [
  "D203",
  "D213",
  "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D103", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
